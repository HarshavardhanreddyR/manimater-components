version: 2
updates:
  # Actions are pinned to commit SHAs (CI enforces it); Dependabot proposes the new SHA and version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
    open-pull-requests-limit: 5
