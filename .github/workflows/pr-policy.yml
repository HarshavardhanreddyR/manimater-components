name: PR policy
# Checks the pull request itself (branch name, title, description, which files it touches) against CONTRIBUTING.md.
#
# This uses pull_request_target ON PURPOSE, so the rules always come from main: a pull request cannot weaken them by
# editing this file or scripts/check_pr_policy.py. That is safe here because the job NEVER runs code from the pull
# request: it only reads its metadata and diffs it with git. Do not add a step that executes, installs or imports
# anything from the pull request's branch.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main (the rules) with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Fetch the pull request's commits as data (not checked out)
        env: { PR: "${{ github.event.pull_request.number }}" }
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
      - name: Check the policy
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          python3 scripts/check_pr_policy.py --base "origin/${BASE_REF}" --head refs/remotes/pr/head \
            --head-ref "$HEAD_REF" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" --author "$AUTHOR" --labels "$LABELS"
