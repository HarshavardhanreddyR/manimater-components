name: Sync to app
# After a merge to main, proposes the same change to the Manimater app as a pull request (see docs/SYNC.md).
# Only trusted code runs here (the merged main). It needs the APP_REPO_TOKEN secret and does nothing without it.
on:
  push:
    branches: [main]
    paths: ["manimate/**", "examples/**", "tests/**", ".github/sync-paths.txt"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-app
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Manimater/manimater-components'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_REPO: ${{ vars.APP_REPO || 'bishnt/manimater' }}
      GH_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, persist-credentials: false }
      - name: Is the sync token configured?
        id: token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::APP_REPO_TOKEN is not set, so nothing was proposed to the app. See docs/SYNC.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ready == 'true'
        name: Clone the app
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            clone --depth 1 "https://github.com/${APP_REPO}.git" "$RUNNER_TEMP/app"
      - if: steps.token.outputs.ready == 'true'
        name: Copy the merged files into the app checkout
        id: sync
        run: python3 scripts/sync_to_app.py --base HEAD^ --head HEAD --app-dir "$RUNNER_TEMP/app" --summary "$RUNNER_TEMP/summary.md"
      - if: steps.token.outputs.ready == 'true' && steps.sync.outputs.changed != '0'
        name: Open a pull request in the app
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          branch="sync/components-$(git rev-parse --short HEAD)"
          cd "$RUNNER_TEMP/app"
          git config user.name "manimater-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add -A
          git commit -q -m "sync: ${subject}" -m "From ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin "$branch"
          base=$(gh repo view "$APP_REPO" --json defaultBranchRef -q .defaultBranchRef.name)
          {
            echo "Proposed automatically from https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo
            echo "**${subject}**"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } > "$RUNNER_TEMP/body.md"
          gh pr create --repo "$APP_REPO" --head "$branch" --base "$base" --title "sync: ${subject}" --body-file "$RUNNER_TEMP/body.md"
