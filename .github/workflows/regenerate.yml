name: Regenerate catalog
# Maintainer-run. Runs a branch's code (so READ IT FIRST), regenerates catalog.json and the generated docs, pushes the
# result to that branch and starts CI on it (pushes made with GITHUB_TOKEN do not start CI by themselves).
# Hardening: the token is NOT left in the checkout (persist-credentials: false), so the code being run cannot reuse it; it is
# handed to git only for the final push. The default branch is refused: changes to main go through a pull request.
on:
  workflow_dispatch:
    inputs:
      branch: { description: "Branch to update (a contribution branch)", required: true }

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse the default branch
        env: { BRANCH: "${{ inputs.branch }}" }
        run: |
          case "$BRANCH" in main|master|"") echo "::error::Never regenerate onto the default branch. Do it on the pull request's branch."; exit 1;; esac
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { ref: "${{ inputs.branch }}", persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml }
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - run: pip install -e ".[dev]"
      - run: |
          python -m manimate.catalog > catalog.json
          python scripts/gen_docs.py
      - name: Commit and start CI
        env: { GH_TOKEN: "${{ github.token }}", BRANCH: "${{ inputs.branch }}" }
        run: |
          git config user.name "manimater-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to regenerate."; else
            git commit -q -m "chore: regenerate catalog.json and generated docs"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin "HEAD:${BRANCH}"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
